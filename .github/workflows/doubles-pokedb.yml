# Doubles usage refresh from champs.pokedb.tokyo — the only source that
# carries Season M-5 doubles. Runs on a GitHub runner, never the home
# server: pokedb banned the previous home IP in July 2026. One full pass
# per day at ~60s per request (~4h); a 403/429 aborts the run.
# 12:00 UTC = 21:00 KST, so it finishes well before the 03:00 KST home
# cron pushes the singles refresh.
name: Doubles usage refresh (pokedb)

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'pokedb season number (5 = M-5)'
        default: '5'
      limit:
        description: 'smoke test: fetch at most N detail pages (0 = all)'
        default: '0'

permissions:
  contents: write

concurrency:
  group: doubles-pokedb
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch doubles usage
        run: |
          python3 tools/fetch_pokedb_doubles.py \
            --season "${{ github.event.inputs.season || '5' }}" \
            --rule 1 --sleep 60 --cache /tmp/pokedb_cache \
            --limit "${{ github.event.inputs.limit || '0' }}"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/champions_usage_doubles.json; then
            echo "no change"; exit 0
          fi
          git add assets/champions_usage_doubles.json
          git commit -m "chore(data): doubles refresh from pokedb ($(date -u +%F))"
          git pull --rebase origin main
          git push origin main
